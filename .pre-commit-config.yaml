repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix, --statistics]
      - id: ruff-format
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--check]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
          - mdformat-tables
        files: '^(docs|src/ml_playground|tests|\.dev-guidelines)/.*\.md$|^[^/]+\.md$'
  - repo: local
    hooks:
      # Type checking (medium)
      - id: basedpyright
        name: basedpyright (standard)
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            uv run basedpyright --level error src/ml_playground
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            uv run mypy --incremental
        language: system
        pass_filenames: false

      # Dead code scan (medium)
      - id: vulture
        name: vulture
        entry: uv run vulture
        args: [src/ml_playground, --min-confidence, "90"]
        language: system
        pass_filenames: false

      # Test stages (heavier)
      - id: pytest-regression
        name: regression tests
        entry: uv
        args: [run, pytest, -q, -rA, tests/regression]
        language: system
        pass_filenames: false
      - id: pytest-integration
        name: integration tests
        entry: uv
        args: [run, pytest, -q, -rA, tests/integration, --no-cov]
        language: system
        pass_filenames: false
      - id: pytest-acceptance
        name: acceptance tests
        entry: uv
        args: [run, pytest, -q, -rA, tests/acceptance]
        language: system
        pass_filenames: false
      - id: pytest-e2e
        name: e2e tests
        entry: uv
        args: [run, pytest, -q, -rA, tests/e2e]
        language: system
        pass_filenames: false

      # Coverage threshold (heaviest)
      - id: coverage-threshold
        name: unit and property tests with coverage threshold
        entry: uv
        args: [run, tools, test, coverage, --verbose]
        language: system
        pass_filenames: false
