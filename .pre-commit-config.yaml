repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--check]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
          - mdformat-tables
        files: '^(docs|src/ml_playground|tests|\.dev-guidelines)/.*\.md$|^[^/]+\.md$'
  - repo: local
    hooks:
      - id: coverage-threshold
        name: coverage threshold (from config)
        entry: uv run tools test coverage-threshold
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            uv run basedpyright --level error src/ml_playground
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            uv run mypy --incremental
        language: system
        pass_filenames: false
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.11
    hooks:
      - id: vulture
        args: [src/ml_playground, --min-confidence, "90"]
        pass_filenames: false
