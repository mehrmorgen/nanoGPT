fail_fast: true
repos:
  - repo: local
    hooks:
      - id: regression-tests
        name: regression tests
        entry: uv
        args:
          - run
          - --no-sync
          - tools
          - test
          - regression
        language: system
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/tox-dev/tox-toml-fmt
    rev: v1.1.0
    hooks:
      - id: tox-toml-fmt
        files: '\\.toml$'
  - repo: local
    hooks:
      - id: yamlfix
        name: yamlfix (format)
        entry: uv
        args:
          - run
          - --no-sync
          - yamlfix
          - ".github"
          - "docs"
          - "scripts"
          - "src"
          - "tests"
          - ".dev-guidelines"
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck (strict)
        entry: uv
        args:
          - run
          - --no-sync
          - pyrefly
          - check
          - --error
          - redundant-cast
          - --error
          - redundant-condition
          - --error
          - unnecessary-comparison
          - --error
          - unreachable
          - --error
          - unused-ignore
          - --error
          - deprecated
          - src/ml_playground
        language: system
        pass_filenames: false
      - id: vulture
        name: vulture
        entry: uv
        args:
          - run
          - --no-sync
          - vulture
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: coverage-threshold
        name: coverage threshold (unit + property)
        entry: uv
        args:
          - run
          - --no-sync
          - tools
          - test
          - coverage-threshold
          - --verbose
        language: system
        pass_filenames: false
      - id: integration-tests
        name: integration tests
        entry: uv
        args:
          - run
          - --no-sync
          - tools
          - test
          - integration
        language: system
        pass_filenames: false
      - id: acceptance-tests
        name: acceptance tests
        entry: uv
        args:
          - run
          - --no-sync
          - tools
          - test
          - acceptance
        language: system
        pass_filenames: false
      - id: e2e-tests
        name: e2e tests
        entry: uv
        args:
          - run
          - --no-sync
          - tools
          - test
          - e2e
        language: system
        pass_filenames: false
