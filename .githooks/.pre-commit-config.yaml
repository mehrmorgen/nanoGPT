repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.9.6
  hooks:
  - id: ruff
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/executablebooks/mdformat
  rev: 0.7.17
  hooks:
  - id: mdformat
    additional_dependencies:
      - mdformat-gfm
    files: '(README|CONTRIBUTING|LICENSE|CHANGELOG)\.md$|^(docs|tests|\.dev-guidelines)/.*\.md$'
- repo: local
  hooks:
  - id: ruff-ok
    name: ruff (summary)
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "[ruff] OK"
    language: system
    pass_filenames: false
  - id: ruff-format-ok
    name: ruff-format (summary)
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "[ruff-format] OK"
    language: system
    pass_filenames: false
  - id: mdformat-ok
    name: mdformat (summary)
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "[mdformat] OK"
    language: system
    pass_filenames: false
  - id: coverage-threshold
    name: coverage threshold (>=87.00%)
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        COVERAGE_DIR=".cache/coverage"
        CACHE_GLOB="${COVERAGE_DIR}/coverage.sqlite*"
        mkdir -p "${COVERAGE_DIR}"
        if ! compgen -G "${CACHE_GLOB}" > /dev/null; then
          echo "[info] generating coverage data"
          rm -f "${CACHE_GLOB}"
          uvx --from . ci-tasks coverage-test
        else
          echo "[info] reusing cached coverage data"
        fi
        if ! compgen -G "${COVERAGE_DIR}/coverage.sqlite"* > /dev/null; then
          echo "[error] No coverage data found. Run 'uvx --from . ci-tasks coverage-test' first." >&2
          exit 2
        fi
        if compgen -G "${COVERAGE_DIR}/coverage.sqlite."* > /dev/null; then
          COVERAGE_FILE="${COVERAGE_DIR}/coverage.sqlite" uv run coverage combine
        fi
        COVERAGE_FILE="${COVERAGE_DIR}/coverage.sqlite" uv run coverage report -m --fail-under=87.00
        echo "[coverage] TOTAL: $(COVERAGE_FILE=\"${COVERAGE_DIR}/coverage.sqlite\" uv run coverage report -m | tail -n 1 | awk '{print $NF}')"
    language: system
    pass_filenames: false
  - id: pyright
    name: pyright
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        uv run pyright src/ml_playground
        echo "[pyright] OK"
    language: system
    pass_filenames: false
  - id: mypy
    name: mypy
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        uv run mypy --incremental src/ml_playground
        echo "[mypy] OK"
    language: system
    pass_filenames: false
  - id: vulture
    name: vulture
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        uv run vulture src/ml_playground --min-confidence 90
        echo "[vulture] OK"
    language: system
    pass_filenames: false
