repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.9.6
  hooks:
  - id: ruff
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/executablebooks/mdformat
  rev: 0.7.17
  hooks:
  - id: mdformat
    additional_dependencies:
      - mdformat-gfm
    files: '(README|CONTRIBUTING|LICENSE|CHANGELOG)\.md$|^(docs|tests|\.dev-guidelines)/.*\.md$'
- repo: local
  hooks:
  - id: coverage-threshold
    name: coverage threshold (>=87.00%)
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        COVERAGE_DIR=".cache/coverage"
        CACHE_GLOB="${COVERAGE_DIR}/coverage.sqlite*"
        mkdir -p "${COVERAGE_DIR}"
        if ! compgen -G "${CACHE_GLOB}" > /dev/null; then
          rm -f "${CACHE_GLOB}"
          uvx --from . ci-tasks coverage-test
        fi
        if ! compgen -G "${COVERAGE_DIR}/coverage.sqlite"* > /dev/null; then
          echo "[error] No coverage data; run 'uvx --from . ci-tasks coverage-test'." >&2
          exit 2
        fi
        if compgen -G "${COVERAGE_DIR}/coverage.sqlite."* > /dev/null; then
          COVERAGE_FILE="${COVERAGE_DIR}/coverage.sqlite" uv run coverage combine
        fi
        COVERAGE_FILE="${COVERAGE_DIR}/coverage.sqlite" uv run coverage report -m --fail-under=87.00
    language: system
    pass_filenames: false
  - id: acceptance
    name: acceptance tests
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        uvx --from . ci-tasks acceptance
    language: system
    pass_filenames: false
  - id: integration
    name: integration tests
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        uvx --from . ci-tasks integration
    language: system
    pass_filenames: false
  - id: e2e
    name: e2e tests
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        uvx --from . ci-tasks e2e
    language: system
    pass_filenames: false
- repo: https://github.com/RobertCraigie/pyright-python
  rev: v1.1.387
  hooks:
  - id: pyright
    args: [src/ml_playground]
    pass_filenames: false
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.11.2
  hooks:
  - id: mypy
    args: [--incremental]
    pass_filenames: false
- repo: https://github.com/jendrikseipp/vulture
  rev: v2.11
  hooks:
  - id: vulture
    args: [src/ml_playground, --min-confidence, '90']
    pass_filenames: false
- repo: local
  hooks:
  - id: acceptance
    name: acceptance tests
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        uvx --from . ci-tasks acceptance
    language: system
    pass_filenames: false
  - id: integration
    name: integration tests
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        uvx --from . ci-tasks integration
    language: system
    pass_filenames: false
  - id: e2e
    name: e2e tests
    entry: bash
    args:
      - -c
      - |
        set -euo pipefail
        uvx --from . ci-tasks e2e
    language: system
    pass_filenames: false
