repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.9.6
  hooks:
  - id: ruff
    args: [--fix]
- repo: https://github.com/DavidAnson/markdownlint-cli2
  rev: v0.15.0
  hooks:
  - id: markdownlint-cli2
    files: '^(README|CONTRIBUTING|LICENSE|CHANGELOG)\.md$'
- repo: https://github.com/checkmake/checkmake.git
  # Or another commit hash or version
# Source of truth for hooks; root .pre-commit-config.yaml mirrors this for pre-commit discovery.
  rev: 0.2.2
  hooks:
  # Use this hook to let pre-commit build checkmake in its sandbox
  - id: checkmake
- repo: local
  hooks:
    # TODO(mock-free-refactor): re-enable coverage badge hook after coverage branch lands
    # - id: coverage-badge
    #   name: coverage badge
    #   entry: bash
    #   args:
    #     - -c
    #     - |
    #       set -e
    #       if ! compgen -G ".cache/coverage/coverage.sqlite*" > /dev/null; then
    #         COVERAGE_FILE=.cache/coverage/coverage.sqlite make coverage-test
    #       fi
    #       make coverage-badge SKIP_COVERAGE_TESTS=1
    #       git add docs/assets/coverage.svg docs/assets/coverage-lines.svg docs/assets/coverage-branches.svg
    #   language: system
    #   pass_filenames: false
    #   stages: [pre-commit]
    - id: coverage-threshold
      name: coverage threshold (>=93.80% lines, >=87.20% branches)
      entry: bash
      args:
        - -c
        - |
          set -euo pipefail
          uv run ci-tasks coverage-test
          uv run ci-tasks coverage-threshold --line-threshold 93.8 --branch-threshold 87.2 --verbose
      language: system
      pass_filenames: false
    - id: integration-tests
      name: integration tests
      entry: uv
      args: [run, ci-tasks, integration]
      language: system
      pass_filenames: false
    - id: acceptance-tests
      name: acceptance tests
      entry: uv
      args: [run, ci-tasks, acceptance]
      language: system
      pass_filenames: false
    - id: e2e-tests
      name: e2e tests
      entry: uv
      args: [run, ci-tasks, e2e]
      language: system
      pass_filenames: false
    - id: basedpyright
      name: basedpyright (strict)
      entry: uv
      args: [run, basedpyright, src/ml_playground]
      language: system
      pass_filenames: false
    - id: mypy
      name: mypy
      entry: uv
      args: [run, mypy, --incremental, src/ml_playground]
      language: system
      pass_filenames: false
    - id: vulture
      name: vulture
      entry: uv
      args: [run, vulture, src/ml_playground, --min-confidence, "90"]
      language: system
      pass_filenames: false
