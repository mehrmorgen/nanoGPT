[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ml-playground"
version = "0.1.0"
description = "A minimal GPT training repo (uv-integrated)"
readme = "README.md"
authors = [
    { name = "Andrej Karpathy" },
]
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3.4",
    "requests>=2.32.5",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.1",
    "datasets>=4.3.0",
    "beautifulsoup4>=4.14.2",
    "html2text>=2024.2.26",
    "playwright>=1.49.0",
    "pydantic>=2.12.3",
    "notebook>=7.4.7",
    "typer==0.20.0",
    "pathspec>=0.12.1",
    "sentencepiece>=0.2.1",
    "pandas-stubs==2.3.2.250926",
    "toml>=0.10.2",
    "hatchling>=1.27.0",
    "pip >= 25.3",
    "torch==2.10.0+cpu; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version < '3.13'",
    "torch==2.10.0; platform_system == 'Linux' and platform_machine != 'x86_64'",
    "torch==2.10.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "torch==2.10.0; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "torch==2.10.0; platform_system == 'Windows'",
    "transformers==4.57.1",
    "peft>=0.17.1",
    "tensorboard>=2.20.0",
    "torch-tb-profiler>=0.4.3",
]

[project.scripts]
cli = "ml_playground.runtime_cli.main:main_entry"
ml-playground = "ml_playground.runtime_cli.main:main_entry"
tools = "ml_playground.tools.cli.main:main_entry"

[project.optional-dependencies]

# Optional extra: LIT integration (install only when needed)
# Note: lit-nlp currently pulls transitive deps (e.g., llvmlite via umap-learn) that
# are not compatible with Python 3.13. The extra is therefore disabled on 3.13+
# to allow `uv sync --extra lit` to succeed without attempting incompatible installs.
lit = [
    #"lit-nlp>=1.3.1; # python_version < '3.13'",
]


[tool.uv]
package = true
# Lockfile will be auto-generated by `uv lock` or `uv sync`

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux' and platform_machine == 'x86_64' and python_version < '3.13'" },
]

[tool.ml_playground.cache]
base_dir = ".cache"

[tool.ml_playground.cache.env]
PRE_COMMIT_HOME = ".cache/pre-commit"
RUFF_CACHE_DIR = ".cache/ruff"
UV_CACHE_DIR = ".cache/uv"
HYPOTHESIS_DATABASE_DIRECTORY = ".cache/hypothesis"
HYPOTHESIS_STORAGE_DIRECTORY = ".cache/hypothesis"


[tool.hatch.build.targets.wheel]
allow-implicit-namespace = true
packages = ["src/ml_playground"]
include = [
    "src/ml_playground",
    "src/ml_playground/**",
]

# No additional files to force-include

[tool.hatch.build.targets.sdist]
allow-implicit-namespace = true
include = [
    "pyproject.toml",
    "src/ml_playground",
    "src/ml_playground/**",
]


[dependency-groups]
# Mandatory dev tooling available in the project venv
# Sync with: uv sync --group all to install these extras when needed.
all = [
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "pytest-bdd>=8.1.0",
    "slipcover>=1.0.17",
    "ruff>=0.14.2",
    "pyrefly>=0.42.3",
    "types-requests>=2.32.4.20250913",
    "types-PyYAML>=6.0.12.20250915",
    "types-tqdm>=4.66.0.20240106",
    "types-psutil>=5.9.5.17",
    "types-beautifulsoup4>=4.12.0.20240106",
    "types-toml>=0.10.8.7",
    "vulture>=2.14",
    "cosmic-ray>=8.4.3",
    "hypothesis>=6.142.4",
    "tomli-w>=1.2.0",
    "pre-commit>=4.3.0",
    "coverage-badge>=1.1.2",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "tox-toml-fmt>=1.1.0",
    "yamlfix>=1.18.0",
    "psutil>=6.0.0",
]

[tool.mdformat]
wrap = 120
number = false

[tool.markdownlint]
disable = ["MD033"]

[tool.tox-toml-fmt]
# The canonical formatter enforces deterministic TOML style. No additional options required.

[tool.yamlfix]
line_length = 120
sequence_style = "block_style"
mapping_style = "block_style"
whitelines = 1
explicit_start = false
explicit_end = false
preserve_quotes = true

[tool.ruff]
respect-gitignore = true
# Most exclusions handled by .gitignore, only add specific overrides if needed
cache-dir = ".cache/ruff"

[tool.ruff.lint]



[tool.pyrefly]
project-includes = [
    "src/ml_playground",
    "tests",
]
project-excludes = [
    "out",
    "data",
    "datasets",
    "checkpoints",
    "runs",
    "wandb",
    "lightning_logs",
    "artifacts",
    "mlruns",
    "htmlcov",
    ".idea",
    ".vscode",
    ".venv",
    "env",
    ".cache",
    ".git",
]
search-path = ["src", "."]
disable-search-path-heuristics = true
enabled-ignores = ["type", "pyrefly"]
untyped_def_behavior = "check-and-infer-return-type"

[tool.pytest.ini_options]
# Updated pytest settings for ml_playground
addopts = "-qq -W error --strict-markers --strict-config --import-mode=importlib -r fEsxX -m \"not external\" -W \"ignore:Skipping collection of '.hypothesis' directory.*:UserWarning\""
pythonpath = ["src", "."]
testpaths = [
    "tests",
]
cache_dir = ".cache/pytest"
norecursedirs = [
    ".git",
    ".idea",
    ".vscode",
    ".venv",
    "env",
    "out",
    "data",
    "datasets",
    "checkpoints",
    "runs",
    "wandb",
    "lightning_logs",
    "artifacts",
    "mlruns",
    ".cache",
    ".hypothesis",
    "htmlcov",
]
filterwarnings = [
    # Hypothesis plugin warns when skipping '.hypothesis' if norecursedirs overrides defaults.
    # We centralize Hypothesis database under .cache/hypothesis; ignore this warning under -W error.
    "ignore:Skipping collection of '.hypothesis' directory.*:UserWarning",
]
markers = [
    "slow: marks tests as slow (deselected by default)",
    "integration: marks tests as integration tests",
    "acceptance: marks tests as acceptance (deselect with '-m \"not acceptance\"')",
    "e2e: marks tests as end-to-end tests",
    "external: marks tests that depend on external network/services (deselected by default)",
]
bdd_features_base_dir = "tests/acceptance/features/"

[tool.hypothesis]
deadline = "200 ms"
database = ".cache/hypothesis"
derandomize = true

[tool.vulture]
paths = [
    "src/ml_playground",
    "tests",
]
min_confidence = 90
ignore_names = [
    "exc_info",
    "stack_info",
    "stacklevel",
    "extra",
]

[tool.ruff.lint.isort]
known-first-party = ["ml_playground", "tests"]
classes = []

[tool.coverage.run]
branch = true
parallel = true
data_file = ".cache/coverage/coverage.sqlite"
source = [
    "ml_playground",
]
omit = [
    "tests/*",
    "*/conftest.py",
    "**/datasets/*",
    "**/runs/*",
    "**/wandb/*",
    "**/lightning_logs/*",
    "**/artifacts/*",
    "**/mlruns/*",
    "**/.hf_cache/*",
    "**/.cache/*",
    "**/.git/*",
    "*/ml_playground/tools/*",
    "ml_playground/tools/*",
    "**/ml_playground/tools/*",
]

[tool.coverage.report]
# Use line/branch thresholds as the gate; keep report strict but do not double-gate on total
exclude_lines = [
    # Only allow exclusion for truly impossible-to-test code
    "pragma: no cover",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
    "def __repr__",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
omit = [
]
skip_covered = false
# Enforce a raised total coverage gate aligned with current project coverage
fail_under = 97.5
precision = 2

# Custom coverage thresholds for CI
[tool.ml_playground.coverage.thresholds]
line_threshold = 97.6
branch_threshold = 95.0

[tool.ml_playground.testing.budgets]
integration_seconds = 5.0
e2e_seconds = 15.0

[tool.ml_playground.server]
default_host = "127.0.0.1"

[tool.ml_playground.regression.policy]
# Standard repo configuration files permitted to exist outside pyproject.toml
allowed_config_files = [
    "pyproject.toml",
    "uv.lock",
    "LICENSE",
    "README.md",
    "gap_analysis.md",
    "GEMINI.md",
    "AGENTS.md",
]

[tool.coverage.html]
directory = ".cache/coverage/htmlcov"

[cosmic-ray]
module-path = "src/ml_playground"
timeout = 1.0
excluded-modules = [
  "ml_playground/core/tokenizer_protocol.py",
  "ml_playground/training/optim/lr_scheduler.py",
]
test-command = "pytest -q -n auto tests/unit"
no-copy-source-files = false

[cosmic-ray.session]
file = ".cache/cosmic-ray/session.sqlite"

[cosmic-ray.distributor]
name = "local"
