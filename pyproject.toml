[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ml-playground"
version = "0.1.0"
description = "A minimal GPT training repo (uv-integrated)"
readme = "README.md"
authors = [
    { name = "Andrej Karpathy" },
]
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3.2",
    "requests>=2.32.5",
    "tiktoken>=0.11.0",
    "tqdm>=4.67.1",
    "datasets>=4.0.0",
    "beautifulsoup4>=4.13.5",
    "pydantic>=2.11.7",
    "notebook>=7.4.5",
    "typer==0.17.3",
    "sentencepiece>=0.2.1",
    "pandas-stubs==2.3.2.250827",
    "toml>=0.10.2",
    "hatchling>=1.27.0",
    "pip >= 25.2",
    "torch==2.8.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torch==2.8.0; platform_system == 'Linux' and platform_machine != 'x86_64'",
    "torch==2.8.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "torch==2.8.0; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "torch==2.8.0; platform_system == 'Windows'",
    "transformers==4.56.0",
    "peft>=0.17.1",
    
    
    "mlflow>=3.8.1",
]

[project.scripts]
ci-tasks = "tools.ci_tasks:main"
cli = "ml_playground.cli:main"
env-tasks = "tools.env_tasks:main"
lint-tasks = "tools.lint_tasks:main"
lit-tasks = "tools.lit_tasks:main"
ml-playground = "ml_playground.cli:main"
test-tasks = "tools.test_tasks:main"

[project.optional-dependencies]

# Optional extra: LIT integration (install only when needed)
lit = [
    #"lit-nlp>=1.3.1; # python_version < '3.13'",
]


[tool.uv]
package = true

[tool.uv.sources]

[tool.ml_playground.cache]
base_dir = ".cache"

[tool.ml_playground.cache.env]
PRE_COMMIT_HOME = ".cache/pre-commit"
RUFF_CACHE_DIR = ".cache/ruff"
UV_CACHE_DIR = ".cache/uv"
HYPOTHESIS_DATABASE_DIRECTORY = ".cache/hypothesis"
HYPOTHESIS_STORAGE_DIRECTORY = ".cache/hypothesis"


[tool.hatch.build.targets.wheel]
packages = ["src/ml_playground"]
include = [
    "src/ml_playground",
    "src/ml_playground/**",
]

[tool.hatch.build.targets.wheel.force-include]
"tools" = "tools"

[tool.hatch.build.targets.sdist]
include = [
    "pyproject.toml",
    "src/ml_playground",
    "src/ml_playground/**",
    "tools",
    "tools/**",
]


[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-xdist>=3.8.0",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "pytest-benchmark>=4.0.0",
    "coverage[toml]>=7.10.6",
    "ruff>=0.12.11",
    "mypy>=1.17.1",
    "pyright>=1.1.405",
    "types-requests>=2.32.4.20250809",
    "vulture>=2.11.0",
    "cosmic-ray>=8.3.0",
    "hypothesis>=6.0.0",
    "tomli-w>=1.0.0",
    "pre-commit>=4.3.0",
    "coverage-badge>=1.1.0",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
]



[tool.mdformat]
wrap = 120
number = false



[tool.ruff]
respect-gitignore = true
extend-exclude = [
    ".idea",
    ".vscode",
    "out",
    "**/out/**",
    "data",
    "datasets",
    "**/datasets/**",
    "checkpoints",
    "**/checkpoints/**",
    "*.pt",
    "runs",
    "**/runs/**",
    "wandb",
    "**/wandb/**",
    "lightning_logs",
    "**/lightning_logs/**",
    "artifacts",
    "**/artifacts/**",
    "mlruns",
    "**/mlruns/**",
    ".cache",
    "**/.cache/**",
    ".venv",
    "env",
    ".git",
    "htmlcov",
]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
extend-select = [
  "TID252",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock" = { msg = "Do not use mocks; prefer fixtures/fakes per .dev-guidelines/TESTING.md." }
"pytest_mock" = { msg = "Do not use pytest-mock; prefer fixtures/fakes per .dev-guidelines/TESTING.md." }
"mock" = { msg = "Do not use mock; prefer fixtures/fakes per .dev-guidelines/TESTING.md." }
"pytest.MonkeyPatch" = { msg = "Do not use monkeypatch; inject dependencies via fixtures and DI hooks." }

[tool.mypy]
files = ["src/ml_playground"]
exclude = '(^|.*/)(out/|data/|datasets/|checkpoints/|runs/|wandb/|lightning_logs/|artifacts/|mlruns/|htmlcov/|src/ml_playground/experiments/|src/ml_playground/analysis/|\.idea/|\.vscode/|\.venv/|env/|\.cache/|\.git/)'
explicit_package_bases = true
mypy_path = ["src"]
namespace_packages = true
follow_imports = "skip"
ignore_missing_imports = true
cache_dir = ".cache/mypy"


[tool.pytest.ini_options]
addopts = "-W error --strict-markers --strict-config -v -W \"ignore:Skipping collection of '.hypothesis' directory.*:UserWarning\""
pythonpath = ["src", "."]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
norecursedirs = [".git", ".idea", ".vscode", ".venv", "env", "out", "data", "datasets", "checkpoints", "runs", "wandb", "lightning_logs", "artifacts", "mlruns", ".cache", ".hypothesis", "htmlcov"]
filterwarnings = [
    "ignore:Skipping collection of '.hypothesis' directory.*:UserWarning",
    "ignore::pytest_benchmark.logger.PytestBenchmarkWarning",
]
markers = [
    "slow: marks tests as slow (deselected by default)",
    "integration: marks tests as integration tests",
    "acceptance: marks tests as acceptance (deselect with '-m \"not acceptance\"')",
    "e2e: marks tests as end-to-end tests",
]
bdd_features_base_dir = "tests/acceptance/features/"

[tool.ruff.lint.isort]
known-first-party = ["ml_playground", "tests", "tools"]
classes = []

[tool.coverage.run]
branch = true
parallel = true
data_file = ".cache/coverage/coverage.sqlite"
source = ["ml_playground"]
omit = ["tests/*", "*/conftest.py", "**/datasets/*", "**/runs/*", "**/wandb/*", "**/lightning_logs/*", "**/artifacts/*", "**/mlruns/*", "**/.hf_cache/*", "**/.cache/*", "**/tools/*", "**/_remote_module_non_scriptable.py", "src/ml_playground/analysis/*"]

[tool.coverage.report]
exclude_lines = ["if 0:", "if __name__ == .__main__.:"]
show_missing = true
omit = ["src/ml_playground/analysis/*"]
skip_covered = false
fail_under = 90.0
precision = 2

[tool.coverage.html]
directory = ".cache/coverage/htmlcov"

[cosmic-ray]
module-path = "src/ml_playground"
timeout = 1.0
excluded-modules = ["ml_playground/core/tokenizer_protocol.py", "ml_playground/training/optim/lr_scheduler.py"]
test-command = "pytest -q -n auto tests/unit"
no-copy-source-files = false

[cosmic-ray.session]
file = ".cache/cosmic-ray/session.sqlite"

[cosmic-ray.distributor]
name = "local"
