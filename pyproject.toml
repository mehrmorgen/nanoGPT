[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ml-playground"
version = "0.1.0"
description = "A minimal GPT training repo (uv-integrated)"
readme = "README.md"
authors = [
    { name = "Andrej Karpathy" },
]
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3.4",
    "requests>=2.32.5",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.1",
    "datasets>=4.3.0",
    "beautifulsoup4>=4.14.2",
    "pydantic>=2.12.3",
    "notebook>=7.4.7",
    "typer==0.20.0",
    "pathspec>=0.12.1",
    "sentencepiece>=0.2.1",
    "pandas-stubs==2.3.2.250926",
    "toml>=0.10.2",
    "hatchling>=1.27.0",
    "pip >= 25.3",
    "torch==2.9.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "torch==2.9.0; platform_system == 'Linux' and platform_machine != 'x86_64'",
    "torch==2.9.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "torch==2.9.0; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "torch==2.9.0; platform_system == 'Windows'",
    "transformers==4.57.1",
    "peft>=0.17.1",
    "tensorboard>=2.20.0",
    "torch-tb-profiler>=0.4.3",
]

[project.scripts]
ci-tasks = "ml_playground.tools.cli:main_entry"
cli = "ml_playground.runtime.cli.main:main_entry"
env-tasks = "ml_playground.tools.cli:main_entry"
lint-tasks = "ml_playground.tools.cli:main_entry"
lit-tasks = "ml_playground.tools.cli:main_entry"
ml-playground = "ml_playground.runtime.cli.main:main_entry"
test-tasks = "ml_playground.tools.cli:main_entry"
tools = "ml_playground.tools.cli:main_entry"

[project.optional-dependencies]

# Optional extra: LIT integration (install only when needed)
# Note: lit-nlp currently pulls transitive deps (e.g., llvmlite via umap-learn) that
# are not compatible with Python 3.13. The extra is therefore disabled on 3.13+
# to allow `uv sync --extra lit` to succeed without attempting incompatible installs.
lit = [
    #"lit-nlp>=1.3.1; # python_version < '3.13'",
]


[tool.uv]
package = true
# Lockfile will be auto-generated by `uv lock` or `uv sync`

[tool.uv.sources]
# allow system-specific torch wheels to be resolved from PyPI

[tool.ml_playground.cache]
base_dir = ".cache"

[tool.ml_playground.cache.env]
PRE_COMMIT_HOME = ".cache/pre-commit"
RUFF_CACHE_DIR = ".cache/ruff"
UV_CACHE_DIR = ".cache/uv"
HYPOTHESIS_DATABASE_DIRECTORY = ".cache/hypothesis"
HYPOTHESIS_STORAGE_DIRECTORY = ".cache/hypothesis"


[tool.hatch.build.targets.wheel]
packages = ["src/ml_playground"]
include = [
    "src/ml_playground",
    "src/ml_playground/**",
]

# No additional files to force-include

[tool.hatch.build.targets.sdist]
include = [
    "pyproject.toml",
    "src/ml_playground",
    "src/ml_playground/**",
]


[dependency-groups]
# Mandatory dev tooling available in the project venv
# Sync with: uv sync --group dev to install these extras when needed.
dev = [
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.0.0",
    "coverage[toml]>=7.11.0",
    "ruff>=0.14.2",
    "mypy>=1.18.2",
    "basedpyright>=1.32.1",
    "types-requests>=2.32.4.20250913",
    "types-PyYAML>=6.0.12.20250915",
    "vulture>=2.14",
    "cosmic-ray>=8.4.3",
    "hypothesis>=6.142.4",
    "tomli-w>=1.2.0",
    "pre-commit>=4.3.0",
    "coverage-badge>=1.1.2",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "psutil>=6.0.0",
]



[tool.mdformat]
wrap = 120
number = false



[tool.ruff]
respect-gitignore = true
# Most exclusions handled by .gitignore, only add specific overrides if needed
cache-dir = ".cache/ruff"

[tool.ruff.lint]
extend-select = [
  "TID251", # flake8-tidy-imports banned API
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock" = { msg = "Do not use mocks; prefer fixtures/fakes per .dev-guidelines/TESTING.md." }
"pytest_mock" = { msg = "Do not use pytest-mock; prefer fixtures/fakes per .dev-guidelines/TESTING.md." }
"mock" = { msg = "Do not use mock; prefer fixtures/fakes per .dev-guidelines/TESTING.md." }
"pytest.MonkeyPatch" = { msg = "Do not use monkeypatch; inject dependencies via fixtures and DI hooks." }

# When invoked without explicit targets, analyze only the project code.
[tool.mypy]
# When invoked without explicit targets, analyze only the project code.
files = ["src/ml_playground", "src/ml_playground/runtime"]
# Also exclude common ignored/artifact directories if mypy is invoked without args.
# Additionally exclude analysis (LIT integration) to avoid pulling heavy third-party types
# that slow down type checking and are not part of core runtime.
exclude = '(^|.*/)(out/|data/|datasets/|checkpoints/|runs/|wandb/|lightning_logs/|artifacts/|mlruns/|htmlcov/|src/ml_playground/experiments/|src/ml_playground/analysis/|\\.idea/|\\.vscode/|\\.venv/|env/|\\.cache/|\\.git/)'

explicit_package_bases = true
mypy_path = ["src"]
namespace_packages = true

# Speed up type checking by not following imports into third-party libraries
follow_imports = "skip"
# Avoid spending time resolving missing type stubs for external deps (torch, transformers, etc.)
ignore_missing_imports = true
cache_dir = ".cache/mypy"


[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = [
    "src/ml_playground",
    "tests",
]
exclude = [
    "src/ml_playground/tools",
    "tests/unit/tools",
    "tests/property/tools",
    "tests/acceptance/tools",
     "src/ml_playground/runtime",
    "tests/unit/runtime",
    "tests/property/runtime",
    "tests/acceptance/runtime",
    "tests/unit/cli",
    "tests/property/cli",
    "tests/acceptance/cli",
]
stubPath = "typings"

[[tool.basedpyright.executionEnvironments]]
root = "."
extraPaths = ["src"]


[tool.pytest.ini_options]
# Updated pytest settings for ml_playground
addopts = "-qq -W error --strict-markers --strict-config -r fEsxX -W \"ignore:Skipping collection of '.hypothesis' directory.*:UserWarning\""
pythonpath = ["src", "."]
testpaths = [
    "tests",
]
cache_dir = ".cache/pytest"
norecursedirs = [
    ".git",
    ".idea",
    ".vscode",
    ".venv",
    "env",
    "out",
    "data",
    "datasets",
    "checkpoints",
    "runs",
    "wandb",
    "lightning_logs",
    "artifacts",
    "mlruns",
    ".cache",
    ".hypothesis",
    "htmlcov",
]
filterwarnings = [
    # Hypothesis plugin warns when skipping '.hypothesis' if norecursedirs overrides defaults.
    # We centralize Hypothesis database under .cache/hypothesis; ignore this warning under -W error.
    "ignore:Skipping collection of '.hypothesis' directory.*:UserWarning",
]
markers = [
    "slow: marks tests as slow (deselected by default)",
    "integration: marks tests as integration tests",
    "acceptance: marks tests as acceptance (deselect with '-m \"not acceptance\"')",
    "e2e: marks tests as end-to-end tests",
]
bdd_features_base_dir = "tests/acceptance/features/"

[tool.hypothesis]
deadline = "200 ms"
database = ".cache/hypothesis"
derandomize = true

[tool.ruff.lint.isort]
known-first-party = ["ml_playground", "tests"]
classes = []

[tool.coverage.run]
branch = true
parallel = true
data_file = ".cache/coverage/coverage.sqlite"
source = [
    "ml_playground",
]
omit = [
    "tests/*",
    "*/conftest.py",
    "**/datasets/*",
    "**/runs/*",
    "**/wandb/*",
    "**/lightning_logs/*",
    "**/artifacts/*",
    "**/mlruns/*",
    "**/.hf_cache/*",
    "**/.cache/*",
    "src/ml_playground/runtime/**",
]

[tool.coverage.report]
# Require 87% coverage to match combined unit+property gate while keeping reports strict
exclude_lines = [
    # Only allow exclusion for truly impossible-to-test code
    "if 0:",
    "if __name__ == .__main__.:",
]
show_missing = true
omit = [
    # No exclusions needed - tools are now part of the main codebase
]
skip_covered = false
# Align with CI gate threshold for unit+property suites  
fail_under = 86.0
precision = 2

# Custom coverage thresholds for CI
[tool.ml_playground.coverage.thresholds]
line_threshold = 90.0
branch_threshold = 83.0

[tool.coverage.html]
directory = ".cache/coverage/htmlcov"

[cosmic-ray]
module-path = "src/ml_playground"
timeout = 1.0
excluded-modules = [
  "ml_playground/core/tokenizer_protocol.py",
  "ml_playground/training/optim/lr_scheduler.py",
]
test-command = "pytest -q -n auto tests/unit"
no-copy-source-files = false

[cosmic-ray.session]
file = ".cache/cosmic-ray/session.sqlite"

[cosmic-ray.distributor]
name = "local"




