# Minimal test configuration for SpeakGer experiment to keep CLI tests fast.
# Focus on [sampling] only to satisfy strict sample loader in CLI tests.

[sampling.runtime]
out_dir = "./out/test_run"
device = "cpu"
dtype = "float32"
compile = false
seed = 42

[sampling.sample]
start = ""
num_samples = 1
max_new_tokens = 4
temperature = 0.8
top_k = 0
