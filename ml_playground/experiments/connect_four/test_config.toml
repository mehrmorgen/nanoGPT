# Compact configuration for tests and CI checks.

[train.model]
n_layer = 1
n_head = 1
n_embd = 32
block_size = 64
dropout = 0.0
bias = false

[train.data]
batch_size = 4
block_size = 64
grad_accum_steps = 1

[train.optim]
learning_rate = 0.001
weight_decay = 0.0
beta1 = 0.9
beta2 = 0.99
grad_clip = 1.0

[train.schedule]
decay_lr = false
warmup_iters = 0
lr_decay_iters = 0
min_lr = 0.0

[train.runtime]
max_iters = 20
eval_interval = 5
eval_iters = 2
log_interval = 5
eval_only = false
seed = 42
device = "cpu"
dtype = "float32"
compile = false

[train.runtime.checkpointing]
ckpt_last_filename = "ckpt_last.pt"
ckpt_best_filename = "ckpt_best.pt"
ckpt_metric = "val_loss"
ckpt_greater_is_better = false
ckpt_atomic = true
ckpt_write_metadata = true
ckpt_time_interval_minutes = 0

[train.runtime.checkpointing.keep]
last = 1
best = 1

best_smoothing_alpha = 0.0
early_stop_patience = 0
ema_decay = 0.0

[sample.runtime]
out_dir = "./out/tests/connect_four"
max_iters = 0
eval_interval = 1
eval_iters = 1
log_interval = 1
eval_only = false
always_save_checkpoint = false
seed = 42
device = "cpu"
dtype = "float32"
compile = false

[sample.sample]
start = "[START]\n.|.|.|.|.|.|.\n.|.|.|.|.|.|.\n.|.|.|.|.|.|.\n.|.|.|.|.|.|.\n.|.|.|.|.|.|.\n.|.|.|.|.|.|."
num_samples = 1
max_new_tokens = 64
temperature = 0.8
top_k = 50
